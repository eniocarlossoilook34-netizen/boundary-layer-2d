[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "boundary-layer-2d"
version = "1.0.0"
description = "Teoria e solução numérica da camada limite laminar 2D: Blasius, Falkner–Skan, Thwaites e um solver de marcha Crank–Nicolson para as equações de Prandtl."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["numpy>=1.24", "scipy>=1.10", "matplotlib>=3.7"]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4", "pillow>=9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY"]
# B007: Picard loop counter is read after the loop; B905: zip(strict=) is noise here
ignore = ["E741", "B007", "B905"]
